name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Demo mode so the browser suite can read sign-in codes off the screen.
      DEMO_MODE: "1"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx prisma generate && npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Start server
        run: |
          npm start > server.log 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://127.0.0.1:43123/ && exit 0; sleep 1; done
          cat server.log; exit 1

      # Uses the Google Chrome preinstalled on GitHub's Ubuntu runners.
      - name: Browser tests
        run: npm run test:e2e
        env:
          SCREENSHOT_DIR: e2e-screenshots

      - name: Upload screenshots and server log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure
          path: |
            e2e-screenshots
            server.log
          if-no-files-found: ignore

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t campus-food-court .
      - name: Start it and check it answers
        run: |
          docker run -d --name app -p 43123:43123 -e DEMO_MODE=1 campus-food-court
          for i in $(seq 1 60); do curl -sf -o /dev/null http://127.0.0.1:43123/ && break; sleep 1; done
          curl -sf http://127.0.0.1:43123/enter | grep -q "Sign in to order" || { docker logs app; exit 1; }
          docker exec app test -s /data/session-secret
      - name: The dietary tag script runs in the image
        run: |
          docker exec app npm run -s db:tag-dietary | tee tag-dietary.log
          grep -q "^0 to tag" tag-dietary.log
